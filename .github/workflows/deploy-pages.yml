name: Deploy static site to Pages

on:
  # Déploie à chaque push sur main
  push:
    branches: [main]
  # Permet aussi un déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:

# Droits nécessaires au déploiement Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; ne pas annuler celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Racine du dépôt : index.html est servi directement
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
